name: Build Desktop Installers (Windows & Linux)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electron:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: windows
            build_script: build:win
          - os: ubuntu-latest
            platform_name: linux
            build_script: build:linux

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências de Sistema (Linux AppImage/deb)
        if: matrix.platform_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 rpm fakeroot dpkg

      - name: Instalar Pacotes NPM
        run: npm install

      - name: Compilar Instaladores Electron (${{ matrix.platform_name }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.build_script }}

      - name: Enviar Instaladores para Aba Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CraftTunnelP2P-${{ matrix.platform_name }}-installers
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: warn

      - name: Publicar automaticamente no GitHub Releases (em Push de Tag ou Main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && format('v1.0.{0}', github.run_number) || github.ref_name }}
          name: "CraftTunnel P2P Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
